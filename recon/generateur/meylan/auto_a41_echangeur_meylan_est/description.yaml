description: >
  Section d'autoroute à 2 × 3 puis 2 × 2 voies séparées par un terre-plein étroit revêtu avec une GBA en béton ; côté
  sud, une seconde chaussée à 2 voies (la branche qui vient de la Rocade Sud N87) court parallèlement à l'A41 sens
  Chambéry, séparée par une double glissière, puis la rejoint : 4 voies côte à côte sur 260 m, et la voie de droite
  disparaît en biseau (3 voies). Dans le sens Grenoble, une voie de décélération de 100 m s'ouvre à droite puis la
  sortie 26 « Meylan-Est » se détache avec un musoir à chevrons ; la bretelle (1 voie de 4 m, 70 km/h) monte en courbe
  vers un pont qui enjambe l'autoroute. BAU de 3 m, glissières simples aux bords, rideaux d'arbres des deux côtés,
  pas d'éclairage.
