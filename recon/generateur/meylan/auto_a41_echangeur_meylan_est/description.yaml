# A41 à Meylan — demi-échangeur n° 26 « Meylan-Est / Inovallée » et convergence de la branche venant de la N87.
# État 2024-2025 (photos Panoramax 23/06/2024, 01/06/2025, 14/06/2025 ; ortho IGN BD ORTHO 2024 du 09/08/2024).
