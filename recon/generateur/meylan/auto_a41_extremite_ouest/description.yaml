  deux côtés, la voie de gauche se rabat après 100 m (panneau de réduction de voies), il en reste deux ; terre-plein
  central très large (10 m d'herbe entre deux glissières, 14 m entre les lignes continues) qui se resserre à 7 m en
  700 m. Vers Grenoble, deux voies à 90 puis trois voies à 70 après l'entrée de Mi-Plaine, candélabres, et l'autoroute
  se termine sur un carrefour à feux (feux sur potence) ; la sortie 27 se détache 800 m avant. Talus enherbés et
  arbres, zone d'activités de Mi-Plaine au nord.
