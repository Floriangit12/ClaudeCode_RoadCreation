  chaussees_separees: {entraxe_lignes_tpc_m: 6.9, sens_gauche: ouest, sens_droite: est}   # B1 [O]
  dispositifs_retenue:                                                                  # B3
    - {limite: "berme|BAU gauche", type: glissiere_simple, hauteur_m: 0.75, decalage_m: 0.3, de: 0, a: 549.9, prov: "P a2064553 ; hauteur [R] gamme N2 courante, non mesurée"}
    - {limite: "BDG|TPC gauche", type: glissiere_simple, hauteur_m: 0.75, decalage_m: 0.5, de: 0, a: 549.9, contournement_pile: {a: 69.7}, prov: "P a2064553 l-51, 28b78e21 (pile)"}
    - {limite: "TPC|BDG droite", type: glissiere_simple, hauteur_m: 0.75, decalage_m: -0.5, de: 0, a: 549.9, contournement_pile: {a: 69.7}, prov: "P 5d4f7b5b l-51"}
    - {limite: "BAU|berme droite", type: glissiere_simple, hauteur_m: 0.75, decalage_m: -0.3, de: 0, a: 549.9, prov: "P 28b78e21, 716ad033"}
  ouvrages:                                                                             # B5
    - type: passage_superieur
      nom: pont du chemin des Pépinières
      a: 69.7                         # [O] coupe s0080 : tablier de s = 65,7 à 73,7
      biais_deg: 88                   # [OSM] 4247849 cap 349° contre 77° pour l'A41
      largeur_tablier_m: 8.0          # [O] 80 px à 0,10 m
      profil_tablier: "trottoir 1,3 béton | bordure haute | chaussée 5,4 enrobé | bordure haute | trottoir 1,3 béton"   # [P] 716ad033 l+154 t−35, 84303e7a ; largeurs ± 0,3
      tirant_air_m: 5.0               # [R] RF-GV-PON-012 : ≥ 4,75 + 0,10 sur autoroute ; non mesuré
      appuis: [{type: pile, position: tpc, largeur_m: 1.0}, {type: culee_perree, cote: gauche}, {type: culee_perree, cote: droite}]   # [P] 28b78e21 l+0
      garde_corps: {type: barreaude, couleur: "montants vert-jaune, cadre noir", hauteur_m: 1.0}   # [P] 716ad033 ; [R] DEF-033
      marquage_trottoir: "ligne jaune discontinue sur la bordure (arrêt interdit)"           # [P] 716ad033 l+154
      osm: [4247849, 822420923, 822420926]
  equipements:                                                                          # B6
    - {type: cloture_autoroutiere, cote: gauche, decalage_m: 9.0, prov: "P a2064553 l+0 (grillage sur poteaux en haut du talus)"}
    - {type: cloture_autoroutiere, cote: droite, decalage_m: 6.0, prov: "P 716ad033 l+103 (estimé)"}
    - {type: ligne_haute_tension, traversee_a: 260, prov: "P a2064553 l−51 (pylône treillis au sud)"}
    - {type: eclairage, valeur: aucun, prov: "OSM lit=no ; P toutes photos"}
  talus:                                                                                # B7
    - {cote: gauche, sens: montant, hauteur_m: 3.0, pente: "2/3", vegetation: "herbe haute puis arbres feuillus", prov: "P a2064553 l+0 (hauteur estimée ± 1 m)"}
  marquages_detail:                                                                     # B8
    - {ligne: "entre voies, sens est", modulation: T3, de: 130, a: 549.9, motif: "dissuasion avant la bifurcation N87 (RF-MQ-DEC-02)", prov: "O coupes s0180-s0530"}
    - {ligne: "entre voies, sens ouest", modulation: T3, de: 0, a: 130, motif: "dissuasion avant la sortie 27", prov: "O coupe s0080 ; P 716ad033 l−103"}
  etapes:                                                                               # B12 : ordre de construction
    - "1 plate-forme : terrassement au terrain naturel (+ talus nord), assise des deux chaussées et du TPC"
    - "2 ouvrage : pile dans le TPC, culées perrées, tablier du chemin des Pépinières (avant la couche de roulement)"
    - "3 chaussées : enrobé des deux chaussées (BDG + 2 voies + BAU), dévers en toit vers l'extérieur 2,5 %"
    - "4 TPC et accotements : terre végétale et herbe haute, bermes enherbées"
    - "5 retenue : 4 files de glissières simples (2 au bord des BAU, 2 dans le TPC, contournant la pile)"
    - "6 marquages longitudinaux : rives continues 3u du TPC, T4 3u des BAU, T1 puis T3 2u entre voies"
    - "7 signalisation verticale : D41c (présignalisation de bifurcation) sur 2 mâts côté est"
    - "8 équipements : clôtures, ligne HT"
    - "9 abords : talus enherbé et arbres au nord, champ et peupliers au sud"
  provenance:
