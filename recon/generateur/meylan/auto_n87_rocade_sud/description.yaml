description: >
  Voie rapide à 2 × 2 voies et 90 km/h, sans éclairage, qui monte en remblai du pont de l'Isère vers l'échangeur de
  l'A41 en décrivant une large courbe. Les deux chaussées sont collées l'une à l'autre de part et d'autre d'une GBA en
  béton (terre-plein revêtu de 2 m entre les lignes continues). Chaque sens a deux voies de 3,5 à 3,8 m ; à droite,
  vers le nord une BAU de 2,5 m et une glissière, vers le sud une BAU étroite (1,7 m) contre un muret en béton. Une
  aire de service (station-service) s'ouvre côté sud-ouest avec ses voies de sortie et d'entrée ; portiques de
  signalisation. Enrobé ancien fissuré, marquages un peu usés, bois et talus enherbés, ligne HT, falaise du
  Saint-Eynard en fond.
