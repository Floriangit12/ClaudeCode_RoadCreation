origine: [917939.1, 6459841.3]           # [OSM] médiane A41 (fin de auto_a41_section_courante), L93
description: >
  Grand échangeur à plusieurs niveaux entre l'A41 (2 × 2 voies, TPC enherbé à deux glissières) et la Rocade Sud N87
  qui arrive du sud en remblai. La N87 passe au-dessus de l'A41 par un long pont à poutres en béton sur piles (graffitis
  sur la poutre de rive) et se divise en deux : une chaussée à 2 voies file vers Chambéry en longeant l'A41 au sud,
  une bretelle à une voie fait une boucle pour rejoindre l'A41 vers Grenoble par une voie d'insertion. En sens inverse,
  l'A41 vers Grenoble se dédouble avant le pont : 2 voies vers Grenoble-Centre, 2 voies vers la Rocade Sud (Gières,
  Domaine universitaire) qui passent au-dessus de l'A41 ; la sortie « Sisteron » quitte l'A41 vers Chambéry par une
  bretelle en courbe. Au nord, l'hélice de Meylan (bretelle à 30 km/h qui tourne sur elle-même et passe sous son propre
  pont, entre murets et talus) monte vers un carrefour à feux de Meylan-Centre, d'où partent les bretelles vers
  La Tronche (A41) et la Rocade Sud. Bretelles d'une voie de 4 m, rives continues à gauche, tirets longs à droite,
  glissières, balises de virage sur les courbes, chevrons aux musoirs ; pas d'éclairage sur l'autoroute.
