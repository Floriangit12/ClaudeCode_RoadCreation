# Nœud A41 / N87 « échangeur de Meylan » (avec l'hélice de Meylan) — état 2023-2025 (photos Panoramax 18/03/2023,
# 23/06/2024, 01/06/2025, 14/06/2025 ; ortho IGN 09/08/2024). L'A41 traverse le nœud d'ouest en est (raccord :
# auto_a41_section_courante s = 549,9 → ici s = 0 ; ici s = 1 217,9 → auto_a41_echangeur_meylan_est s = 0) ; la N87
# arrive du sud (auto_n87_rocade_sud s = 997). Les 7 bretelles sont décrites comme tronçons à sens unique ; leurs
# raccords (divergences, convergences, ouvrages superposés) sont dans extensions_auto (BESOINS B2, B5, B15).
# Provenances : [O] ortho (coupes a41_noeud, b_* ; mesures.json), [P] photo (photos.json), [OSM], [R], [G].
# Réseau (lot N1, 18/10/2026) : description au format réseau (FORMAT_DESCRIPTION_RESEAU.md), résolue par
# recon/generateur/reseau/resoudre_reseau.py (appelé par description_vers_modele.py) ; nœuds partagés dans
# ../reseau_meylan.yaml ; date d'état = état le plus récent cohérent d'après les photos du site ; « extensions_auto »
# est une clé de la couche réseau (non portée par l'étape 2, recopiée dans compilation_reseau.json) ; « DBA » =
# séparateur béton double face entre les deux sens (relecture M8 ; « GBA » est le profil simple face).
