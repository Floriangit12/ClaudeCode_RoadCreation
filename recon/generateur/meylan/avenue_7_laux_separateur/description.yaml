  nord-ouest : bande béton avec barrière bordeaux, piste cyclable de 3 m, bande plantée, contre-allée de 3,5 m vers les
  maisons (murs blancs, haies). Côté sud-est : pelouse. Enrobé très fissuré avec pontages.
contexte:
