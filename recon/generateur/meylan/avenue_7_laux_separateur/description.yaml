  - voie 6,5 →                                      # chaussée sud-est, sens nord-est (coupe:t_sw, gam 7,95 → 14,41) ; osm:1377219194
  - bande enherbée 6,0                              # pelouse au sud-est (trottoir de 2,7 m simplifié) ; ortho IGN 2024
evenements:
