  # - la chaussée nord-ouest garde ses DEUX voies jusqu'au bout du tronçon et au-delà (tirets sur e17dc3d0 −003 du
  #   28/07/2026 pris à s ≈ 80 m, 0630f847, 4388769c) : la fermeture de 50-62 m de l'itération 2 est retirée.
  - profil: {a: ≈ 25, nouveau: "voie 4,1 ← | bande plantée 4,2 | piste cyclable 3,0 bidirectionnelle | trottoir 2,1 | voie 3,0 ← | voie 3,0 ← | terre-plein 1,5 pavés | voie 6,5 → | bande enherbée 6,0"}
