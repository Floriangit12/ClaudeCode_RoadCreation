# Cotes : coupes sur le levé GAM et le PCRS (mesures.json « coupes ») ; OSM local.
# Provenance en fin de ligne : coupe:<nom>, photo:<id>, osm:<way>, DEF-/RF- (règle complétée si non dit).
# Tronçon droit de 90 m, du sud-ouest (≈ 60 m du rond-point du Lycée) vers le nord-est (azimut 45°) ; profil au point
