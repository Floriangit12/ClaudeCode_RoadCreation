# Harmonisation (lot N1, relecture M7) : l'axe suit le milieu du séparateur relevé aux coupes t_sw et t0 (cap 51,65°) ;
# l'ancien axe (cap 45° par le point du site) passait 3 à 6 m au nord-ouest du séparateur. Le tronçon part du nœud
# partagé N_7LAUX_SO (coupe t_sw), où aboutit la branche des 7 Laux du rond-point du Lycée, et finit 45 m au-delà du
# point du site. La chaussée nord-ouest arrive au rond-point en deux voies (photo c531e1b2 l+0 : tirets ; coupe t_sw :
# ligne gam 17,98) et n'en a plus qu'une au point du site (coupe t0).
troncon:
  de: N_7LAUX_SO                                    # profil de gauche (nord-ouest) à droite (sud-est) en regardant vers le nord-est
  vers: [29.86, 33.35]                              # 45 m après le point du site, sur l'axe du séparateur
profil:
