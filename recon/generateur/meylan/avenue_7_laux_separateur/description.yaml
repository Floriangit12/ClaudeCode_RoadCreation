  - voie 4,1 ←                                      # contre-allée à sens unique vers le sud-ouest, coupe:t_sw (gam 31,49 → 35,61) ; osm:184096832
  - bande plantée 4,2                               # coupe:t_sw (gam 27,33 → 31,49)
