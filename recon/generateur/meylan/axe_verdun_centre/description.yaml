titre: Avenue de Verdun (D1090), centre — 2 × 1 voies, îlot central peint et refuges bordés, accotements enherbés, piste bidirectionnelle
date_etat: 2025-05-18                   # état le plus récent cohérent : toutes les photos du site sont du 18/05/2025
etat: {nom: printemps_2025, photos: "série Panoramax du 18/05/2025 (sens La Tronche)", ortho: "IGN 09/08/2024"}
confiance: moyenne
origine: [917584.8, 6460592.1]          # origine déplacée de (250, 250) m le 18/10/2026 (précision float32 du HeightField de rg::nivellement : |y| local < 450 m, BESOINS.md G1) ; L93, sans sens propre ; l'ancienne origine (médiane OSM à k = 1 080) est en [-250.0, -250.0]
description: >
  Avenue à 50 km/h, une voie dans chaque sens de 3,60 m séparées par une bande centrale peinte d'environ 3,40 m
  (deux lignes continues et des hachures), qui devient un refuge bordé à chaque passage piéton et s'ouvre en voie de
  tourne-à-gauche aux rues latérales. Pas de bordure le long des voies : rive peinte puis accotement enherbé (fleuri
  par endroits) de 4 à 6 m ; côté nord-ouest, une piste cyclable bidirectionnelle de 4 m en enrobé, côté sud-est un
  trottoir de 2 m ; au-delà, haies taillées, grands arbres (saules, cèdres, peupliers) et immeubles. Candélabres
  simple crosse d'environ 9 m sur l'accotement nord-ouest, abri de bus. Enrobé ancien très fissuré, marquages usés.
