# Avenue de Verdun (D1090), centre de Meylan — 2 × 1 voies à îlot central peint, entre Paquet Jardin (M01, k ≈ 1 004)
# et le carrefour du lycée (M08, k ≈ 1 990), en deux tronçons séparés par le carrefour à feux M17 (k ≈ 1 567).
# Les carrefours relèvent du lot A (paquet_jardin, verdun_centre_feux, verdun_lycee_feux) ; la description pas à pas
# du passage à refuge de k ≈ 1 325 existe déjà (recon/generateur/scenes_meylan/M27_avenue_de_verdun.yaml) : ce site
# la prolonge sur 780 m et corrige ses largeurs par l'ortho. État 2024-2025 (photos Panoramax 18/05/2025 vers le
# sud-ouest ; ortho IGN 09/08/2024). k = abscisse le long de la médiane OSM depuis M14 (comme axe_verdun_ouest).
# Provenances : [O] ortho (coupes verdun_c), [P] photo, [OSM], [R], [G], [M27] description d'étape 1.
# Harmonisation du réseau (lot N1, 18/10/2026, meylan/RELECTURE_PREPARATION.md M1) : un tronçon, un propriétaire. Les
# deux tronçons commencent et finissent sur les nœuds partagés de ../reseau_meylan.yaml, au bout des branches des
# carrefours du lot A (Paquet Jardin, M17, M08) : tronçon 1 de k ≈ 1 104 à k ≈ 1 478, tronçon 2 de k ≈ 1 627 à
# k ≈ 1 920 ; les abscisses des évènements sont comptées depuis ces nouveaux débuts. Le profil du joint est celui que
# le carrefour a mesuré (contrat du nœud) : le résolveur raccorde le profil de l'axe sur 25 à 30 m à chaque bout.
