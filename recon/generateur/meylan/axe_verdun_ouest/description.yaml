description: >
  Grande avenue d'entrée de ville à chaussées séparées, 50 km/h, éclairée. Près de l'autoroute, 3 voies de chaque côté
  dont la voie de droite réservée aux bus (tirets larges), séparées par un terre-plein étroit d'herbe sèche entre deux
  bordures basses ; côté sud-est un alignement de très grands arbres derrière une glissière. Après le carrefour à feux
  de la Plaine Fleurie, 2 voies par sens (plus étroites, 2,6 à 3,2 m) de part et d'autre d'un terre-plein de 3 m
  bordé, planté d'une haie taillée continue d'environ 1,2 m avec des candélabres ; rives peintes, larges accotements
  d'herbe haute avec arbustes, puis de chaque côté, à 15-20 m, une piste cyclable et un trottoir en enrobé ; une
  traversée cyclable peinte en damier jaune (Chronovélo) ; un arrêt de bus avec quai, abri et zigzag jaune avant le
  carrefour des Aiguinards. Enrobé ancien rapiécé et fissuré.
