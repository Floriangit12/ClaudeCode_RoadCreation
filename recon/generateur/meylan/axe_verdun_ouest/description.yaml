# Avenue de Verdun (D1090) côté La Tronche — boulevard urbain à chaussées séparées entre le bout de l'A41 (carrefour
# M14) et le carrefour des Aiguinards (M13). État 2024-2025 (photos Panoramax 24/08/2024 et 18/05/2025, toutes prises
# vers le sud-ouest ; ortho IGN 09/08/2024). Les carrefours à feux M14 (k ≈ 0), M15 Plaine Fleurie (k ≈ 250) et M13
# Aiguinards (k ≈ 649) ne sont pas décrits ici (lot A) : deux tronçons de section courante entre eux.
# k = abscisse le long de la médiane OSM des deux chaussées depuis le carrefour M14 (mesures.json).
# Provenances : [O] ortho (coupes verdun_o), [P] photo, [OSM], [R], [G].
scene: axe_verdun_ouest
nom: Avenue de Verdun, côté La Tronche
titre: Avenue de Verdun (D1090) — 2 × 3 voies avec couloirs bus puis 2 × 2 voies, terre-plein étroit enherbé puis haie taillée
date: 2025-05-18
confiance: moyenne
