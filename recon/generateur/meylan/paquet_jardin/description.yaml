# Carrefour Paquet Jardin (Meylan) — avenue de Verdun × chemin de la Revirée × avenue du Vercors, ÉTAT AVANT TRAVAUX.
# Harmonisation du réseau (lot N1, 18/10/2026 ; meylan/RELECTURE_PREPARATION.md M2) : le site est ramené à l'état d'avant
# les travaux du carrefour (23/06/2025 → 05/12/2025), décision prise avec l'utilisateur (CLAUDE.md du dépôt ;
# recon/out/paquet_jardin/v2_avant_travaux/inventaire/PLAN_AVANT_TRAVAUX.md). Date d'état : 18/05/2025, dernière série
# photographique d'avant travaux (photo 360° 119d9094 au centre : aucun chantier visible, CHANGEMENTS.md § 4).
#
# ÉTAPE 3, PASSE v2 (18/10/2026, itération 2) : CENTRE REFAIT d'après la compréhension de la scène (COMPREHENSION.md),
# construite en croisant les orthos de 7 dates (PCRS 5 cm du 10/05/2022 ; IGN 20 cm 2015, 2018, 2021, 09/08/2024 ;
# IRC 2024 ; Pléiades 2025) et 60 photos (123 vues, dont 54 du centre ; fenêtre d'état 24/08/2024-22/06/2025).
# Ce qui change par rapport à l'itération 1 (provenance « lecture » = grille de 1 m posée sur le PCRS 5 cm,
# recon/out/generateur/meylan_paquet_jardin/_travail/v2/lecture/, confirmée sur les photos de la fenêtre citées) :
# - AXES : la médiane réelle de Verdun (îlots, zone hachurée, nœud OSM à 100 m) passe ≈ 2,1 m au sud-est de la droite
#   du repère (îlots NE et SO à 1,9-2,5 m ; nœud N_VERDUN_PJ_NE à 2,13 m) ; l'axe de la Revirée (ligne continue axiale,
#   azimut 326°) et la médiane du Vercors (îlots en galets, azimut 151° près du carrefour puis 163° au sud de l'îlot
#   long) coupent la médiane de Verdun à ≈ 4,4 m l'un de l'autre (carrefour légèrement décalé). Le centre est pris
#   entre les deux, sur la médiane de Verdun : (0,10 ; −2,85) du repère du site ; chaque branche garde son axe réel,
#   décalé latéralement du centre (Revirée 2,2 m, Vercors 2,1 m), ce que le format admet et rapporte.
# - BRETELLE SE : elle n'entre pas dans le cœur ; elle contourne l'angle sud derrière un grand îlot revêtu (« angle SO »,
#   ≈ 8 × 8 m, mâts, Chronovélo) et rejoint la voie de sortie du Vercors à ≈ 28 m : décrite en îlot directionnel
#   (voie directe en cédez, avec sa traversée), au lieu d'une voie de tourne-à-droite qui débouchait dans le cœur.
# - VERCORS : la sortie et les deux entrées sont séparées par un îlot central en galets (triangle au bord du cœur, puis
#   îlot long jusqu'à ≈ 27 m), coupé par le passage (refuge) : il n'était pas décrit.
# - PASSAGES posés à leur place réelle (retrait dit) ; îlots de Verdun SO (refuges du passage et de la traversée de la
#   Chronovélo) allongés ; îlot de la Revirée en coin (≈ 2,5 m au bord du cœur, nez au-delà du passage) ; angles.
# Ce qui reste hors format (BESOINS.md) : traversée de la Chronovélo en rectangles jaunes, traversées cyclables vertes
# de la Revirée, ligne axiale prolongée dans le cœur (ligne mixte) et flèches TD du cœur, angle ouest planté en pointe.
#
# Provenance des valeurs (commentaire en fin de ligne) : lecture:<image>, coupe:<nom> (levé GAM relu sur l'ortho 2024),
# photo:<id> (photos de la fenêtre d'état sauf mention), osm:<way> (extrait du 01/06/2025), DEF-/RF- (règle complétée si
# non dit). Les valeurs « ≈ » sont des estimations : la description reste grossière.
# Simplifications : branches droites près du carrefour (le Vercors s'incurve à ≈ 27 m) ; plan de feux = hypothèse ;
# bretelle SE en îlot directionnel (rayon et voie dits) au lieu d'une voie séparée de 100 m (besoin P1).
