      # au dessus en enrobé neuf, bordure claire) ; liaison revêtue côté nord-ouest au droit du passage
      - profil: {a: 76, nouveau: "trottoir 3,4 | piste cyclable 3,0 bidirectionnelle | trottoir 3,0 | voie 3,0 ← | voie 3,0 ← | terre-plein 2,4 enrobé | voie 3,25 → | voie 3,25 → | trottoir ≈ 3"}
      # à ≈ 14 m de C : angle ouest planté (îlot d'angle en herbe haute, bordure granit : photo:31d16b8e +160 du
