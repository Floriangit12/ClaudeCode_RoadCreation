      - ouverture: {a: 66, longueur: 4.5, nouveau: "trottoir 1,8 | voie 2,9 ← | terre-plein 2,2 enrobé | voie 2,9 → | trottoir 2,0"}
      - profil: {a: 66, nouveau: "trottoir 1,8 | voie 2,9 ← | terre-plein 2,2 enrobé | voie 2,9 → | trottoir 2,0"}
