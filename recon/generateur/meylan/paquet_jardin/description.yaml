      - profil: {a: 85, nouveau: "trottoir 4,0 | voie 3,3 ← | voie 2,9 ← | terre-plein 2,2 enrobé | tourne-à-gauche 3,0 → | voie 2,9 → | trottoir 2,7 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
