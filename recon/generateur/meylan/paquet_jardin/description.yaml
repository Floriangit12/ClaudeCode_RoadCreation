      - voie 3,0 ←                                  # lecture:pcrs_verdun_so_30 (« 50 » au sol dans les deux voies de sortie, ≈ 3 m)
      - voie 3,0 ←
      - zone hachurée 2,4                           # photo:734a0da6 (-169 : hachures jusqu'à l'îlot du passage)
      - voie 3,25 →
      - voie 3,25 →
      - zone hachurée ≈ 1,7                         # séparation peinte de la bretelle (photos 0fe2656f du 24/08/2024, 034cb578)
      - tourne-à-droite ≈ 4 →                       # bretelle vers le Vercors (osm:168730949 width=4)
      - trottoir ≈ 3                                # quai La Revirée (osm:185326913, 185326912) ; lecture:pcrs_S_bretelle (abri)
    evenements:
      # à ≈ 38-32 m de C : la bretelle quitte le profil de Verdun (elle continue en voie directe, îlot directionnel)
      - fermeture: {a: 68, longueur: 6, nouveau: "trottoir 3,4 | piste cyclable 3,0 bidirectionnelle | bande enherbée ≈ 1 | voie ≈ 3,5 ← | bande enherbée ≈ 2,5 | voie 3,0 ← | voie 3,0 ← | zone hachurée 2,4 | voie 3,25 → | voie 3,25 → | trottoir ≈ 3"}
      # à ≈ 25 m de C (s 75) : la contre-allée s'écarte (fin de la bande parallèle sur ≈ 10 m)
      - fermeture: {a: 75, longueur: 7, nouveau: "trottoir 3,4 | piste cyclable 3,0 bidirectionnelle | bande enherbée 3,0 | voie 3,0 ← | voie 3,0 ← | zone hachurée 2,4 | voie 3,25 → | voie 3,25 → | trottoir ≈ 3"}
