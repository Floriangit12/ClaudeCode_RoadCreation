    de: N_VERDUN_PJ_NE                              # nœud partagé avec axe_verdun_centre (contrat de profil : profil ci-dessous)
    vers: [0.10, -2.85]                             # lecture:pcrs_NE (îlot du passage à 1,9 m de la droite du repère), pcrs_SO
