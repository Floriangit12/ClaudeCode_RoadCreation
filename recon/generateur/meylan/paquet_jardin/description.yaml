carrefours:
  - id: PJ
    nom: carrefour Paquet Jardin
    centre: [0.10, -2.85]                           # sur la médiane réelle de Verdun, entre les axes de la Revirée et du Vercors (lecture)
    regime: feux                                    # osm crossing=traffic_signals (11 au 01/06/2025, dont 1722505401 et 6569621810 sur la bretelle, supprimés en 2025)
    branches:
      - troncon: verdun_ne
        passage: {largeur: 3.0, retrait: 5.5}       # lecture:pcrs_NE : bandes à ≈ 13-16 m de C (frontière calculée à ≈ 7,7 m) ; DEF-011 (« paquet_jardin » : 3,00 m)
        coin: 8                                     # angle nord (DEF-010) ; photo:e5d79de9 (+037)
      - troncon: reviree
        passage: {largeur: 3.0, retrait: 5.0}       # lecture:pcrs_NO : demi-passages décalés à ≈ 14 et 16 m de C, traversées cyclables vertes côté cœur (photo:119d9094 +114)
        coin: 12                                    # angle ouest coupé en pointe (îlot planté) ; lecture:pcrs_NO
      - troncon: verdun_so
        passage: {largeur: 3.0, retrait: 5.0}       # lecture:pcrs_SO : zébra à ≈ 15,5-18,5 m de C ; la traversée de la Chronovélo (≈ 11-14,5 m) est entre le passage et le cœur
      - troncon: vercors
        passage: {largeur: 3.0, retrait: 3.5}       # lecture:pcrs_coin_SO_vercors : passage à ≈ 13-16 m de C, refuge entre le triangle et l'îlot long
        coin: 10                                    # angle est (îlot d'angle planté) ; lecture:pcrs_SE
    ilots:
      # bretelle SE = voie directe Verdun SO → Vercors derrière le grand îlot de l'angle sud (revêtu, mâts, Chronovélo) ;
      # traversée de la bretelle (zébra + rectangles jaunes de la Chronovélo, lecture:pcrs_coin_SO_vercors ; à feux avant
      # 2025, osm:1722505401) ; rayon et voie estimés pour que l'îlot fasse ≈ 8 m de côté (lecture), voie osm width 4
      - {type: directionnel, de: verdun_so, vers: vercors, rayon: 16, largeur_voie: 4.0, passage: oui, remplissage: béton}
    feux:
      # HYPOTHÈSE (plan de feux non observable sur photo) : 2 phases, cycle ≈ 60 s (DEF-028 : 50-70 s en 2 phases)
      note: plan de feux supposé, à remplacer par le plan réel de la Métropole
      phases:
        - nom: P1 avenue de Verdun
          mouvements: [verdun_ne TD, verdun_ne TAD, verdun_ne TAG, verdun_so TD, verdun_so TAG]
          vert: 30
        - nom: P2 Revirée et Vercors
          mouvements: [reviree TD, reviree TAD, reviree TAG, vercors TD, vercors TAD, vercors TAG]
