      - trottoir 4,0                                # coupe:verdun_ne_40 (revêtement 6,67 → 10,59) ; osm:301046541 (piétons et cycles)
      - voie 3,2 ←
      - voie 2,9 ←
      - voie 3,0 →
      - voie 2,9 →
      - bande enherbée 4,8                          # coupe:verdun_ne_80 ; photo:20d1a815 (t007 : bordure, herbe, cheminement)
      - piste cyclable 3,0 bidirectionnelle         # Chronovélo, osm:398052219
      - trottoir 1,8
    evenements:
      # de ≈ 80 à ≈ 47 m de C (s 20 → 55) : la zone hachurée de 2,2 m s'ouvre entre les sens (coupe:verdun_ne_40 ;
      # photo:20d1a815 t005, t006 ; lecture:pcrs_verdun_ne : chevrons vers 50 m) ; la bande enherbée se réduit
      - ouverture: {a: 55, longueur: 35, nouveau: "trottoir 4,0 | voie 3,3 ← | voie 2,9 ← | zone hachurée 2,2 | voie 3,0 → | voie 2,9 → | bande enherbée 2,7 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
      # voie de gauche affectée au tourne-à-gauche vers le Vercors (flèche TAG, photo:119d9094 -162 ; lecture:pcrs_NE)
      - profil: {a: 56, nouveau: "trottoir 4,0 | voie 3,3 ← | voie 2,9 ← | zone hachurée 2,2 | tourne-à-gauche 3,0 → | voie 2,9 → | bande enherbée 2,7 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
