description: >
  Grand carrefour à feux en croix, avant les travaux de 2025 : avenue de Verdun (RD1090) en 2 × 2 voies d'environ 3 m,
  avec un îlot refuge à chaque passage ; chemin de la Revirée au nord-ouest (deux voies d'environ 4 m, îlot en coin qui
  porte les panneaux de direction) ; avenue du Vercors au sud-est (sortie d'une voie large, deux voies d'entrée,
  séparées par un îlot en galets coupé par le passage). Zone hachurée et voie de tourne-à-gauche sur l'approche
  nord-est. Une bretelle d'une voie contourne l'angle sud derrière un grand îlot revêtu et rejoint le Vercors ; une
  contre-allée part vers le parking relais au nord-ouest. Chronovélo le long du côté nord-ouest de Verdun, qui traverse
  Verdun sud-ouest entre deux rangées de rectangles jaunes ; passages piétons à feux sur les quatre branches, enrobé
  ancien fissuré, marquages usés.
