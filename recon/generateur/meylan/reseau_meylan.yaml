# Réseau commun de Meylan (lot N1 « réseau », 18/10/2026) : nœuds partagés entre les sites, contrats de profil aux
# joints, alias des sites et compositions. Lu par recon/generateur/reseau/resoudre_reseau.py (clé « reseau_commun »
# des descriptions de sites) et par l'option --composer.
#
# Règles (meylan/RELECTURE_PREPARATION.md, M1, M2, § 5.2, et CHAINE_CONSTRUCTION.md P3, CC-01, CC-04) :
# - un tronçon, un propriétaire : là où deux sites se recouvraient, le tronçon du site de carrefour (lot A) garde sa
#   longueur et l'axe du lot B commence ou finit sur le nœud partagé ;
# - les nœuds sont en Lambert-93 ; ceux de l'avenue de Verdun sont sur la médiane OSM des deux chaussées (axe du lot B),
#   et le tronçon du lot A y aboutit (rotation de 0,3 à 1,2° autour du centre du carrefour) ;
# - « profil » : contrat du joint (CC-04), lu de gauche à droite en regardant dans la direction « cap_profil » (cap
#   OpenDRIVE en degrés : 0 = est, 90 = nord) ; c'est le profil mesuré par le site « proprietaire » à cet endroit.
#   Un tronçon qui arrive au nœud avec un autre profil reçoit du résolveur un raccord continu sur « raccord » mètres
#   (fermeture des bandes qui disparaissent, puis ouverture des bandes qui naissent) ; le contrôle CC-04 est refait sur
#   le modèle compilé et bloque s'il échoue ;
# - un nœud sans contrat de profil relie des tronçons dont les profils se suivent déjà (A41) ou des chaussées à sens
#   unique au bout d'une route à double sens (nœuds « jumelés » : besoins B2 et B15 du lot B, non portés par l'étape 2).
#
# Dates d'état (date_etat de chaque site) : l'état le plus récent cohérent d'après les photos du site (la date de la
# photo la plus récente qui confirme la description) ; paquet_jardin : état d'avant les travaux de 2025 (décision prise
# avec l'utilisateur, CLAUDE.md du dépôt). Une composition réunit des sites de dates différentes : chacun garde la
# sienne, la scène composée porte la plus récente (avertissement).
