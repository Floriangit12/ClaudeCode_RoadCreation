  RF-GV-GIR-010: "entrées relevées plus larges que la plage urbaine : Chamechaude en une voie de 4,7 m (coupe br_n, levé GAM) et bretelle en deux voies de 2 × 4,1 m (coupe br_s_in, OSM lanes=2)"
