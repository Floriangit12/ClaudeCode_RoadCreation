# Avenue de Verdun (Meylan, centre) au chemin des Buclos — carrefour en baïonnette et passage piéton à feux (site M17).
# État décrit : 28/07/2026 (photos IGN planes de22683a, f252d62f ; Licence Ouverte ; jamais versionnées).
# Cotes : coupes sur les bordures et lignes du levé GAM et la limite PCRS (mesures.json « coupes ») ; OSM local.
# Provenance en fin de ligne : coupe:<nom>, photo:<id>, osm:<way|node>, DEF-/RF- (règle complétée si non dit).
# Géométrie : le chemin des Buclos coupe Verdun en baïonnette : branche sud à ≈ 9 m au sud-ouest du point du site,
# branche nord à ≈ 20 m au nord-est (projection des nœuds OSM sur l'axe de Verdun, azimut 45°) ; deux carrefours en T
# reliés par le tronçon « verdun_milieu » qui porte le passage piéton à feux (le point du site, osm:1333024067/69).
# Simplifications : le carrefour voisin de l'allée de la Faculté (≈ 45 m au nord-est) n'est pas décrit ; la bande
# parallèle au sud-est de Verdun sud-ouest (4,7 m, non identifiée dans OSM) est décrite en trottoir + bande enherbée.
# Réseau (lot N1, 18/10/2026) : description au format réseau (FORMAT_DESCRIPTION_RESEAU.md), résolue par
# recon/generateur/reseau/resoudre_reseau.py (appelé par description_vers_modele.py) ; nœuds partagés et contrats de
# profil dans ../reseau_meylan.yaml ; date d'état = état le plus récent cohérent d'après les photos du site.
format: description_reseau/0.1
reseau_commun: ../reseau_meylan.yaml
scene: meylan_verdun_centre_feux
nom: verdun_centre_buclos
titre: Avenue de Verdun × chemin des Buclos (Meylan) — baïonnette et passage piéton à feux, état du 28/07/2026
date_etat: 2026-07-28                               # photos de22683a et f252d62f du 28/07/2026 (les seules, cohérentes)
etat: {nom: ete_2026, photos: "campagne IGN du 28/07/2026"}
confiance: faible
origine: [917676.06, 6460690.07, 229.32]           # point du site M17 (dossier 13) = passage piéton à feux ; z RGE ALTI
description: >
  Avenue de Verdun en 2 × 1 voies d'environ 3,5 m séparées par une zone hachurée d'environ 3,7 m, coupée en baïonnette
  par le chemin des Buclos (sortie vers le sud, rue à double sens vers le nord, cédez-le-passage). Entre les deux, un
  passage piéton à feux à bouton d'appel avec refuge au milieu ; du refuge à Buclos nord, une voie de tourne-à-gauche
  s'ajoute vers le nord-est. Chronovélo (piste bidirectionnelle de 3 m) côté
  nord-ouest derrière une bande enherbée de 2,5 m, piste mixte côté sud-est ; enrobé très fissuré avec pontages.
contexte:
  agglomeration: oui
  vitesse: 50                                       # osm:1412130586 maxspeed=50
materiaux:
  chaussee: enrobé usé                              # photo:de22683a (t004), photo:f252d62f (t007) : fissures pontées, reprises
  pistes: enrobé
marquages:
  usure: moyenne
troncons:
  # Étape 3 (reconstruction, 18/10/2026) : branches tracées VERS le centre de leur carrefour (exigence du solveur Houdini
  # rg::carrefours : « extrémité début non prise en charge ») ; profils retournés, abscisses ramenées à s = L − a.
  # Le tronçon entre les deux carrefours (≈ 29 m) ne peut pas être une branche des deux à la fois (son début serait au
  # centre d'un carrefour) : il est coupé en deux tronçons de même profil qui se touchent à 16 m de Buclos sud, en un
  # point sans nom (pas de fusion par le résolveur), chacun tracé vers son carrefour (besoin du générateur, BESOINS.md).
  # Verdun sud-ouest, du nœud partagé N_VERDUN_M17_SO (80 m) vers le carrefour sud (Buclos sud) ; gauche = nord-ouest
  - id: verdun_so
    nom: avenue de Verdun sud-ouest
    de: N_VERDUN_M17_SO                             # nœud partagé avec axe_verdun_centre (médiane OSM, à 0,6 m de [-63.17, -63.17]) ; contrat du joint
    vers: [-6.6, -6.6]
    profil:
      - trottoir 1,8                                # coupe:verdun_so_25 (gam 33,47 → 35,29)
      - piste cyclable 3,0 bidirectionnelle         # coupe:verdun_so_25 (gam 29,06 → 32,07) ; Chronovélo osm:398052219
      - bande enherbée 2,8                          # coupe:verdun_so_25 (rive 24,93 → bordure 26,25 → 28,97), rive comprise
      - voie 3,5 ←                                  # coupe:verdun_so_25 (gam 21,49 → 24,93) ; osm:1412130602
      - zone hachurée 3,7                           # coupe:verdun_so_25 (gam 17,83 → 21,49) ; photo:f252d62f (t007)
      - voie 4,1 →                                  # coupe:verdun_so_25 (pcrs 13,74 → gam 17,83) ; osm:1412130586
      - bande enherbée 2,1                          # îlot (coupe:verdun_so_25, pcrs 11,60 → 13,74)
      - trottoir 2,5                                # côté sud-est : bande parallèle non identifiée (coupe:verdun_so_25, pcrs 6,89 → 11,60), simplifiée
  # Verdun entre les deux carrefours, moitié sud (16 m), du point de coupure vers le carrefour sud ; gauche = sud-est.
  # Porte le passage à feux (osm:1333024067 / 1333024069 : feux, bouton d'appel, refuge) et son refuge bordé dans la zone
  # hachurée (photo:de22683a t003 : refuge à nez arrondi et balise ; t004 : zone hachurée à chevrons au-delà du refuge).
  - id: verdun_milieu_s
    nom: avenue de Verdun (entre les deux branches du chemin des Buclos, moitié sud)
    de: [4.71, 4.71]
    vers: [-6.6, -6.6]
    profil:
      - trottoir 2,0
      - piste cyclable 3,0 bidirectionnelle         # piste mixte séparée osm:301046542 (coupe:verdun_ne_15, 4,96 m avec le trottoir)
      - bande enherbée 2,0                          # photo:de22683a (t004)
      # étape 3, itération 1 : vers le nord-est, une seconde voie (tourne-à-gauche) naît au nez du refuge (photo:de22683a
      # t004 : 2 voies et panneau d'affectation C24 dès le refuge ; photo:fce0902f : 2 voies à ≈ 35 m) ; prise sur la zone
      # hachurée et la voie directe (3,5 + 3,7 = 3,25 + 3,0 + 0,95 ; RF-OSM-LAR-012 : 3,25 au plus pour deux voies de même sens)
      - voie 3,25 ←
      - voie 3,0 ←
      - zone hachurée 0,95
      - voie 3,5 →
      - bande enherbée 2,6                          # photo:de22683a (t003)
      - piste cyclable 3,0 bidirectionnelle         # Chronovélo osm:398052219
      - trottoir 1,8
    evenements:
      # refuge bordé du passage à feux, de ≈ 4 à ≈ 12 m de Buclos sud (osm crossing:island=yes ; photo:de22683a t003)
      # passe v2 (COMPREHENSION.md) : deux îlots refuges en D garnis de gravillons de part et d'autre du passage, de
      # ≈ 0,5 à ≈ 13,3 m de ce tronçon (IGN 2024 + levé GAM, modele_gam_S : bordures fermées vers (0 à 3 ; 1 à 5) et
      # (−5 à −2 ; −6 à −2)) ; photos 2b9bed48 -011 (18/05/2025), de22683a (28/07/2026)
      - profil: {a: 0.5, nouveau: "trottoir 2,0 | piste cyclable 3,0 bidirectionnelle | bande enherbée 2,0 | voie 3,5 ← | terre-plein 3,7 gravillons | voie 3,5 → | bande enherbée 2,6 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
      # au droit du passage, les bandes enherbées sont coupées par une liaison revêtue (photo:de22683a t003 : bande verte de traversée)
      - profil: {a: 5.1, nouveau: "trottoir 2,0 | piste cyclable 3,0 bidirectionnelle | trottoir 2,0 | voie 3,5 ← | terre-plein 3,7 gravillons | voie 3,5 → | trottoir 2,6 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
      - profil: {a: 9.7, nouveau: "trottoir 2,0 | piste cyclable 3,0 bidirectionnelle | bande enherbée 2,0 | voie 3,5 ← | terre-plein 3,7 gravillons | voie 3,5 → | bande enherbée 2,6 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
      - profil: {a: 13.3, nouveau: "trottoir 2,0 | piste cyclable 3,0 bidirectionnelle | bande enherbée 2,0 | voie 3,5 ← | zone hachurée 3,7 | voie 3,5 → | bande enherbée 2,6 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
      - passage_pieton: {a: 7.4, largeur: 3.5, regime: feux}   # osm:1333024067 / 1333024069 (feux, bouton d'appel, refuge) ; passe v2 : zébras réels centrés sur le point du site (IGN 2024 + levé GAM, modele_v2_1b), bandes ≈ 3,5 m
  # Verdun entre les deux carrefours, moitié nord (12,85 m), du point de coupure vers le carrefour nord ; gauche = nord-ouest
  - id: verdun_milieu_n
    nom: avenue de Verdun (entre les deux branches du chemin des Buclos, moitié nord)
    de: [4.71, 4.71]
    vers: [13.8, 13.8]
    profil:
      - trottoir 1,8
      - piste cyclable 3,0 bidirectionnelle         # Chronovélo osm:398052219
      - bande enherbée 2,6                          # photo:de22683a (t003)
      - voie 3,5 ←
      - zone hachurée 0,95                          # photo:de22683a (t004, chevrons) ; photo:f252d62f (t004) ; réduite par la voie de TAG (itération 1)
      - tourne-à-gauche 3,0 →                       # étape 3, itération 1 : photo:de22683a (t004 : C24 et 2 voies), photo:fce0902f
      - voie 3,25 →                                 # RF-OSM-LAR-012 (deux voies de même sens : 3,25 au plus)
      - bande enherbée 2,0                          # photo:de22683a (t004)
      - piste cyclable 3,0 bidirectionnelle         # piste mixte séparée osm:301046542
      - trottoir 2,0
  # Verdun nord-est, du nœud partagé N_VERDUN_M17_NE (40 m après Buclos nord) vers le carrefour nord ; gauche = sud-est
  - id: verdun_ne
    nom: avenue de Verdun nord-est
    de: N_VERDUN_M17_NE                             # nœud partagé avec axe_verdun_centre, 40 m après Buclos nord (le lot B décrit la suite) ; contrat du joint
    vers: [13.8, 13.8]
    profil:
      - trottoir 2,0
      - piste cyclable 3,0 bidirectionnelle         # osm:301046542 (piste + trottoir séparés, coupe:verdun_ne_15 gam 7,83 → 12,79)
      - bande enherbée 2,0                          # photo:de22683a (t004)
      - voie 3,5 ←                                  # coupe:verdun_ne_15 (gam 12,79 → 18,34 : 5,55 m avec la rive)
      - zone hachurée 3,7                           # coupe:verdun_ne_15 (gam 18,34 → 22,00) ; photo:de22683a (t004, chevrons)
      - voie 3,5 →                                  # osm:1412130603 (lanes=2 left|through plus loin, vers l'allée de la Faculté)
      - bande enherbée 2,5
      - piste cyclable 3,0 bidirectionnelle         # Chronovélo osm:398052219 (coupe:verdun_ne_15 : 33,07)
      - trottoir 1,8
    evenements:
      # étape 3, itération 1 : la voie de tourne-à-gauche vers le nord-est continue au-delà de Buclos nord jusqu'au
      # débouché de l'allée de la Faculté (≈ 25 m après Buclos nord, non décrit : besoin de carrefour d'extrémité) ;
      # le profil du nœud partagé (contrat, 1 + 1 voies) est rendu à ≈ 15 m du nœud (photo:fce0902f, 2 voies à ≈ 35 m
      # du passage ; osm:1412130603 lanes=2 left|through)
      - ouverture: {a: 15, longueur: 5, nouveau: "trottoir 2,0 | piste cyclable 3,0 bidirectionnelle | bande enherbée 2,0 | voie 3,25 ← | voie 3,0 ← | zone hachurée 0,95 | voie 3,5 → | bande enherbée 2,5 | piste cyclable 3,0 bidirectionnelle | trottoir 1,8"}
  # Chemin des Buclos sud : sortie à sens unique depuis Verdun (osm:28420143 oneway), azimut ≈ 130° ; tracé de la limite
  # de carte vers le carrefour, la voie est donc à contresens du tracé (←)
  - id: buclos_s
    nom: chemin des Buclos sud
    de: [24.04, -32.31]
    vers: [-6.6, -6.6]
    profil: "trottoir 1,5 | voie 4,4 ← | trottoir 1,5"   # coupe:buclos_s_20 (gam 12,33 → pcrs 16,72) ; trottoir osm sidewalk=left
  # Chemin des Buclos nord (osm:581180883 lanes=2 sur ≈ 20 m depuis l'avenue, puis 27286062 à sens unique vers l'avenue,
  # B1 à l'entrée, photo:de22683a t003 ; relecture M6) : de la limite de carte (40 m) vers le carrefour ; gauche = nord-est
  - id: buclos_n
    nom: chemin des Buclos nord
    de: [-11.91, 44.44]
    vers: [13.8, 13.8]
    profil: "trottoir 1,5 | voie 3,5 → | trottoir 1,5"   # partie à sens unique vers l'avenue (osm:27286062) ; largeur non mesurée (photo:f252d62f t004)
    evenements:
      # à ≈ 20 m de l'avenue : la rue devient à double sens (accès du parking ; osm:581180883 lanes=2)
      - ouverture: {a: 22, longueur: 4, nouveau: "trottoir 1,5 | voie 3,0 ← | voie 3,0 → | trottoir 1,5"}
