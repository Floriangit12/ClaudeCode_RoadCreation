        passage: {largeur: 3.0, retrait: 6.0}       # osm:312211595 (passage marqué)
  - id: BN
    nom: Verdun × Buclos nord
    centre: [13.8, 13.8]
    branches:
      - {troncon: verdun_milieu_n, regime: prioritaire, fleches: non}   # branche de 12,85 m : pas de place pour 3 flèches (aucune vue sur les photos)
      - {troncon: verdun_ne, regime: prioritaire}
      - troncon: buclos_n
