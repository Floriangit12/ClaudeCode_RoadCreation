        mouvements: {v2: [TD]}                      # pas de tourne-à-gauche serré vers Buclos sud (rayon de 2,7 m sur la géométrie simplifiée ; relecture M4 : mouvement exclu plutôt qu'admis)
      - troncon: buclos_s
