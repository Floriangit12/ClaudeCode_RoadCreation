      - voie 3,9 ←                                  # coupe:chamrousse_30 (14,12 → 18,0) ; osm:1271547679
      - voie 4,5 →                                  # coupe:chamrousse_30 (gam 9,26 → 13,73) ; osm:7838799
      - bande enherbée 3,4                          # îlot planté bas, coupe:chamrousse_30 (gam 5,82 → 9,26) ; photo:ef8cd80b
      - trottoir 2,8                                # coupe:chamrousse_30 (gam 0,57 → 3,38)
    evenements:
      # Étape 3, itération 1 : près du carrefour, les deux sens de Chamrousse s'écartent autour d'un îlot planté en butte
      # basse (OSM : sortie 7838796 et entrée 7838799 séparées à partir de ≈ 30 m du centre, ≈ 6 m d'écart à 15 m ;
      # photos 208a1f46 du 01/05/2024, cb597029 du 09/05/2024, 921c90d1 du 28/07/2026 : butte plantée bordée) ; largeur
      # constante ≈ 5 m (simplification : l'îlot réel est triangulaire), précédé de sa zone hachurée (ouverture sur 8 m) ;
      # le passage de la branche (à ≈ 25 m du centre, au bord de la zone de conflit) le traverse (refuge revêtu).
      - ouverture: {a: 28, longueur: 8, nouveau: "trottoir 2,0 | bande cyclable 1,5 | voie 3,9 ← | zone hachurée 5,0 | voie 4,5 → | bande enherbée 3,4 | trottoir 2,8"}
      - profil: {a: 28.5, nouveau: "trottoir 2,0 | bande cyclable 1,5 | voie 3,9 ← | terre-plein 5,0 gazon | voie 4,5 → | bande enherbée 3,4 | trottoir 2,8"}
