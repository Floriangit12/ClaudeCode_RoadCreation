# Carrefour à feux avenue de Verdun (RD1090) × avenue de Chamrousse (D590) × chemin de Chaumetière, près du rond-point
# du Lycée (site M08). État décrit : 28/07/2026 (photos IGN planes 921c90d1, 5922e7b4, ef8cd80b ; jamais versionnées).
# Cotes : coupes sur le levé GAM et le PCRS (mesures.json « coupes ») ; voies et régimes : OSM local.
# Provenance en fin de ligne : coupe:<nom>, photo:<id>, osm:<way|node>, DEF-/RF- (règle complétée si non dit).
# Simplifications : le carrefour (chaussées séparées qui se croisent : 4 nœuds de feux OSM) est décrit comme un seul
# carrefour à 4 branches centré au milieu des 4 nœuds ; l'allée du Château (zone 30, au sud-est) n'est pas décrite ;
# les tirets observés dans le carrefour (dossier 13 M08 : « différent » de l'IISR7) ne sont pas décrits (ARB-08) ;
# plan de feux = hypothèse.
# Réseau (lot N1, 18/10/2026) : description au format réseau (FORMAT_DESCRIPTION_RESEAU.md), résolue par
# recon/generateur/reseau/resoudre_reseau.py (appelé par description_vers_modele.py) ; nœuds partagés et contrats de
# profil dans ../reseau_meylan.yaml ; date d'état = état le plus récent cohérent d'après les photos du site.
format: description_reseau/0.1
reseau_commun: ../reseau_meylan.yaml
scene: meylan_verdun_lycee_feux
nom: verdun_chamrousse
titre: Carrefour à feux Verdun × Chamrousse × Chaumetière (Meylan), état du 28/07/2026
date_etat: 2026-07-28                               # photos 921c90d1, ef8cd80b, 5922e7b4 du 28/07/2026 (cohérentes)
etat: {nom: ete_2026, photos: "campagne IGN du 28/07/2026"}
confiance: faible
origine: [917989.78, 6460971.81, 249.21]           # point du site M08 (dossier 13) ; z RGE ALTI
description: >
  Carrefour à feux en croix sur l'avenue de Verdun à chaussées séparées : au nord-est 3 voies d'entrée (gauche, tout
  droit, tout droit et droite) et une sortie, séparées par un îlot de 3 m ; au sud-ouest 2 voies dans chaque sens
  séparées par un îlot ; avenue de Chamrousse à l'ouest (une voie par sens qui s'écartent autour d'un îlot planté
  d'environ 5 m, bande cyclable en sortie) ; chemin de
  Chaumetière au sud (rue étroite à double sens). Îlots plantés en buttes basses, passages piétons sur chaque branche,
  pistes et Chronovélo côté nord-ouest, enrobé fissuré avec pontages.
contexte:
  agglomeration: oui
  vitesse: 50                                       # osm:1293831015 maxspeed=50
materiaux:
  chaussee: enrobé usé                              # photo:921c90d1 (pontages)
  pistes: enrobé
marquages:
  usure: moyenne
troncons:
