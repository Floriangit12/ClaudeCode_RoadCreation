  # « extrémité début non prise en charge ») ; profils retournés (lus de gauche à droite en allant vers le carrefour),
  # abscisses ramenées à s = L − a ; provenance inchangée.
  # Avenue de Verdun nord-est (azimut 52°), de la limite de carte (70 m) vers le centre ; gauche = sud-est (voie sortante)
  - id: verdun_ne
    nom: avenue de Verdun nord-est
    de: [55.16, 43.1]
    vers: [0, 0]
    profil:
      - trottoir 2,0                                # largeur non mesurée (DEF-004)
      - voie 4,4 ←                                  # coupe:ne_30 (gam 4,68 → 9,09) ; osm:39990137 lanes=1
      - terre-plein 3,3 gazon                       # coupe:ne_30 (gam 9,09 → 12,42)
      - tourne-à-gauche 3,6 →                       # coupe:ne_30 (12,42 → 16,00) ; osm:1293831015 left|through|through;right
      - voie 3,6 →                                  # coupe:ne_30 (16,10 → 19,68) : tout droit
      - voie 3,6 →                                  # coupe:ne_30 (19,78 → 23,40) : tout droit + droite
      - bande enherbée 2,0                          # étape 3, itération 1 : ≈ 1,5-2 m à 55-70 m du centre (photos 0c2f5716 du 09/05/2024, a86b55d2 du 18/05/2025)
      - piste cyclable 3,2 bidirectionnelle         # coupe:ne_30 (gam 31,59 → 34,75) ; osm:190080271
    evenements:
      # la bande plantée s'élargit en approchant du carrefour (8,0 m à 30 m : coupe:ne_30 gam 23,46 → 31,52) ; la piste
      # s'écarte de la chaussée (osm:190080271)
      - ouverture: {a: 35, longueur: 15, nouveau: "trottoir 2,0 | voie 4,4 ← | terre-plein 3,3 gazon | tourne-à-gauche 3,6 → | voie 3,6 → | voie 3,6 → | bande enherbée 8,0 | piste cyclable 3,2 bidirectionnelle"}
      # liaison revêtue à travers la bande plantée au droit du passage (photo:5922e7b4 : cheminement vers la piste) ;
      # début avancé de 51,5 à 48,5 aux itérations 1 et 2 (le passage recule avec l'îlot de Chamrousse ; à 47,5 la
      # liaison atteignait le point de tangence du coin nord-ouest, rendu en trottoir au lieu de la butte plantée)
      # Étape 3, passe v2 (COMPREHENSION.md) : l'îlot de la médiane va jusqu'au cœur (nez vers (8,2 ; 4,5) du repère, à
      # ≈ 9 m du centre) et porte le refuge des deux demi-passages (≈ 18,5-20,5 m du centre) : IGN 2024 et levé GAM lus à la
      # grille de 1 m (gam_NE) ; photos 54c3c177 -008 et 8892229b -012 (18/05/2025). Jusqu'ici la dernière section commençait
      # dans la zone de conflit et le compilateur ne faisait aucun îlot (« le terre-plein ne dépasse pas la limite »). La
      # dernière section commence donc à ≈ 21,5 m du centre (îlot porté par le profil jusqu'à la frontière) ; la liaison
      # revêtue n'occupe plus que 3 m le long de la chaussée, la bande plantée reste derrière (angle nord-ouest planté).
      # nez de la médiane revêtu (dessus gris, bordure basse, balise) : photos 54c3c177 -008 et 8892229b -012 du 18/05/2025 ;
      # revêtu dès ≈ 26 m du centre pour que le refuge du passage ne soit pas « revêtu dans un îlot planté » (qui coupe
      # la section et renvoie l'îlot dans la zone de conflit)
      - profil: {a: 44, nouveau: "trottoir 2,0 | voie 4,4 ← | terre-plein 3,3 béton | tourne-à-gauche 3,6 → | voie 3,6 → | voie 3,6 → | bande enherbée 8,0 | piste cyclable 3,2 bidirectionnelle"}
      - profil: {a: 48.5, nouveau: "trottoir 2,0 | voie 4,4 ← | terre-plein 3,3 béton | tourne-à-gauche 3,6 → | voie 3,6 → | voie 3,6 → | trottoir 3,0 | bande enherbée 5,0 | piste cyclable 3,2 bidirectionnelle"}
