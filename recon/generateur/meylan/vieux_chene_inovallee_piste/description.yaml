description: >
  Rue d'Inovallée à 50 km/h, une voie par sens d'environ 3,3 m séparées par un îlot peint ocre de 1 à 2,3 m. Côté nord,
  bande enherbée puis piste séparée piétons / vélos sous de grands arbres. Carrefour en T à feux avec une rue de
  desserte à double sens d'environ 5 m ; passages piétons à feux à bouton d'appel, traversée cyclable à figurines et
  doubles chevrons. Enrobé neuf.
