# Chemin du Vieux Chêne (Meylan, Inovallée) — rue à piste cyclable séparée et carrefour en T à feux (site M16).
# État décrit : 28/07/2026 (photos IGN 360° 7d44455e, 17826b13 ; Licence Ouverte ; jamais versionnées) : enrobé neuf,
# marquages refaits depuis 2024. Cotes : coupes sur le levé GAM et le PCRS (mesures.json « coupes ») ; OSM local.
# Provenance en fin de ligne : coupe:<nom>, photo:<id>, osm:<way|node>, DEF-/RF- (règle complétée si non dit).
# Simplifications : branches droites ; arrêts de bus et zigzags non décrits ; îlots peints ocre décrits en zones
# hachurées (le remplissage ocre sans hachures n'a pas de mot, ../BESOINS_FORMAT.md) ; plan de feux = hypothèse.
# Réseau (lot N1, 18/10/2026) : description au format réseau (FORMAT_DESCRIPTION_RESEAU.md), résolue par
# recon/generateur/reseau/resoudre_reseau.py (appelé par description_vers_modele.py) ; nœuds partagés et contrats de
# profil dans ../reseau_meylan.yaml ; date d'état = état le plus récent cohérent d'après les photos du site.
format: description_reseau/0.1
reseau_commun: ../reseau_meylan.yaml
scene: meylan_vieux_chene_inovallee_piste
nom: vieux_chene_inovallee
titre: Chemin du Vieux Chêne (Inovallée, Meylan) — piste séparée, îlot peint ocre, T à feux, état du 28/07/2026
date_etat: 2026-07-28                               # photos du 28/07/2026 (enrobé refait depuis l'ortho 2024 : la photo prime)
etat: {nom: ete_2026, photos: "campagne IGN du 28/07/2026"}
confiance: faible
origine: [919608.06, 6460487.77, 215.74]           # point du site M16 (dossier 13) ; z RGE ALTI
description: >
  Rue d'Inovallée à 50 km/h, une voie par sens d'environ 3,3 m séparées par un îlot peint ocre de 1 à 2,3 m. Côté nord,
  bande enherbée puis piste séparée piétons / vélos sous de grands arbres. Carrefour en T à feux avec une rue de
  desserte à double sens d'environ 5 m ; passages piétons à feux à bouton d'appel, traversée cyclable à figurines et
  doubles chevrons. Enrobé neuf.
contexte:
  agglomeration: oui
  vitesse: 50                                       # osm:192617503 maxspeed=50
materiaux:
  chaussee: enrobé neuf                             # photo:7d44455e (l+0000.0) : enrobé sombre récent
  pistes: enrobé                                    # photo:7d44455e (l+0051.4)
marquages:
  usure: neuf                                       # photo:7d44455e
troncons:
  # Étape 3 (18/10/2026) : branches tracées VERS le carrefour (de = loin, vers = centre), seule écriture que fabriquent
  # rg::carrefours / rg::marquages_carrefour (« extrémité début non prise en charge ») ; profils lus de gauche à droite
  # en regardant vers le carrefour, donc retournés par rapport au relevé du 17/10 (mêmes bandes, mêmes cotes).
  # Tracés recalés sur OSM : la rue est courbe au-delà de 40 m (osm:997434686 à l'est, 192617503 / 1413619618 à
  # l'ouest) ; l'ancien axe droit passait 4 à 7 m à côté.
  # Îlots peints ocre (photos 7d44455e l-0154.3 et 17826b13 l+0000.0 : remplissage ocre à contour blanc, sans hachures ;
  # RF-OBS-ILO-03) : « zone hachurée … enrobé ocre » (le remplissage plein n'a pas de mot, BESOINS.md V2). Reprise du
  # 18/10 : avec les polylignes du relevé (cassures de 21,5° et 17,3° non raccordées), toute zone hachurée centrale faisait
  # s'emballer le raffinement de Triangulate 2D de rg::sol (hython jusqu'à 67 Go ; 8 essais sous garde mémoire, BESOINS.md
  # V1) ; itération 0 fabriquée sans les îlots ; itération 1 : tracés lissés (cassures ≤ 9°), îlots rétablis.
  # Chemin du Vieux Chêne ouest : arrive de l'ouest-nord-ouest ; gauche = nord (piste), droite = sud
  - id: vc_ouest
    nom: chemin du Vieux Chêne ouest
    # itération 1 : même tracé lissé (coins de Chaikin, cassures ≤ 5° ; la cassure de 21,5° non raccordée est soupçonnée de
    # faire s'emballer le sol sous les hachures de l'îlot peint, BESOINS.md V1)
    polyligne: [[-73.85, 34.65], [-63.62, 32.48], [-57.94, 30.93], [-53.39, 29.28], [-48.84, 27.29], [-44.29, 24.96], [-38.60, 21.71], [-31.77, 17.53], [-21.53, 10.92], [-1.04, -2.64]]   # osm:192617502 / 192617503 / 1413619618 (axe entre les deux sens)
    profil:
      # au-delà du passage : bande enherbée entre chaussée et piste (coupe:o_20, gam 18,99 → 22,66)
      - trottoir 1,6                                # coupe:o_20 (ligne 25,59 → gam 27,20)
      - piste cyclable 2,9 bidirectionnelle         # coupe:o_20 (gam 22,66 → ligne 25,59) ; osm:1025301610 segregated=yes
      - bande enherbée 3,7                          # coupe:o_20 (gam 18,99 → 22,66)
      - voie 3,3 ←                                  # coupe:o_20 (gam 15,68 → 18,99)
      - zone hachurée 2,3 enrobé ocre               # itération 1 : îlot peint ocre, coupe:o_20 (gam 13,39 → 15,68) ; photos 17826b13, fe78d282, 71607e1f
      - voie 3,3 →                                  # coupe:o_20 (gam 9,88 → 13,22)
      - trottoir 1,8                                # coupe:o_20 (gam 8,03 → 9,88)
    evenements:
      # au droit du passage (11 derniers mètres) : liaison revêtue entre chaussée et piste (photo:7d44455e)
      # (l'îlot peint, qui va jusqu'au passage et y finit en refuge peint arrondi, n'est pas décrit : voir plus haut)
      - profil: {a: 72, nouveau: "trottoir 1,6 | piste cyclable 2,9 bidirectionnelle | trottoir 3,7 | voie 3,3 ← | zone hachurée 2,3 enrobé ocre | voie 3,3 → | trottoir 1,8"}
      # Passe 2 (COMPREHENSION.md § 2.2) : l'îlot peint ocre traverse le passage (refuge peint rond au milieu du passage)
      # et finit par un nez arrondi ≈ 1,5 m après lui, vers x ≈ −5 (photos 7d44455e −014, fe78d282 −165 du 28/07/2026) ;
      # le modèle le mène au centre du carrefour : la fermeture de la zone au droit du passage (évènement « fermeture »
      # a = 78, ou changement de profil instantané a = 77,5) fait s'emballer Triangulate 2D de rg::sol (essais du
      # 18/10/2026 sous garde mémoire, essais/passe2/essai_ouest*.log ; BESOINS V7) : non décrite
  # Chemin du Vieux Chêne est : arrive de l'est (courbe osm:997434686 puis droite au cap 146° vers le carrefour) ;
  # gauche = sud, droite = nord (bande enherbée puis piste)
  - id: vc_est
    nom: chemin du Vieux Chêne est
    polyligne: [[90.10, -34.80], [81.79, -35.39], [74.50, -35.74], [67.20, -35.57], [60.50, -34.85], [54.19, -33.76], [48.32, -32.39], [42.44, -30.43], [36.88, -27.58], [29.14, -22.92], [15.56, -13.93], [-1.04, -2.64]]   # osm:997434686, 192617497 / 1425999597 (itération 1 : tracé lissé)
    profil:
      - bande enherbée 1,1                          # coupe:e_20 (gam 5,56 → 6,67) ; bande étroite et haie, photo:7d44455e (l-0154.3)
      - voie 3,4 ←                                  # coupe:e_20 (gam 6,69 → 10,05)
      - zone hachurée 1,0 enrobé ocre               # itération 1 : îlot peint ocre, coupe:e_20 (gam 10,05 → 11,00) ; photos 7d44455e (l-0154.3), 96e5dcb1
      - voie 3,0 →                                  # coupe:e_20 (gam 11,00 → pcrs 14,01)
      - bande enherbée 7,1                          # coupe:e_20 (gam 14,29 → 21,41)
      - piste cyclable 2,9 bidirectionnelle         # osm:1025301610 / 379460301 (coupe:e_20 : 21,44 → 23,32, mesure partielle)
    evenements:
      # Passe 2 : loin du carrefour (x > 35), l'îlot n'existe pas (axe en tirets, photo b15b7c4c +011 ; deux lignes
      # continues qui s'écartent, 7a1d2d4e +006) ; l'ouverture de la zone de s ≈ 60 à 75 combinée à la fermeture
      # ci-dessous fait s'emballer rg::sol (fab_passe2_iter2b.log, arbre tué à 10 Go ; BESOINS V7) : seule la
      # fermeture près du carrefour est gardée (essai_est_ferm.log : fabrication normale)
      # Passe 2 (COMPREHENSION.md § 2.3) : l'îlot peint ocre de la branche est commence par un nez arrondi à ≈ 10 m du
      # centre (s ≈ 89,5 ; photos 7d44455e −169 et cbd7ccdb +002 du 28/07/2026 ; à la place du petit îlot bordé de 2024,
      # bordures GAM (5,5 ; −10) → (8 ; −12)) ; entre le nez et le carrefour, les deux sens sont côte à côte
      - fermeture: {a: 90, longueur: 2, nouveau: "bande enherbée 1,1 | voie 3,4 ← | voie 3,0 → | bande enherbée 7,1 | piste cyclable 2,9 bidirectionnelle"}
  # Rue de desserte nord (osm:1425974964 shared_lane) ; arrive du nord-nord-est ; gauche = est
  - id: desserte_n
    nom: chemin du Vieux Chêne (desserte nord)
    de: [33.37, 46.51]
    vers: [-1.04, -2.64]
    profil: "trottoir 1,4 | voie 2,6 ← | voie 2,6 → | trottoir 2,0"   # coupe:n_12 (gam 2,71 → 4,69 ; pcrs 4,73 → 9,91 ; → gam 11,30)
carrefours:
  - id: VCI
    nom: Vieux Chêne × desserte (Inovallée)
    centre: [-1.04, -2.64]                          # nœud osm du carrefour
    regime: feux                                    # osm traffic_signals 13051761817 / 818 / 819
    branches:
      - troncon: vc_ouest
        passage: {largeur: 4.0}                     # osm:2214342016 / 2214342020 (feux, bouton d'appel), refuge rond, photo:7d44455e
      - troncon: vc_est
      - troncon: desserte_n
        passage: {largeur: 4.0}                     # osm:311840595 (feux) + traversée cyclable à figurines et chevrons, photo:7d44455e (l+0051.4)
    feux:
      # HYPOTHÈSE (plan de feux non observable) : 2 phases, cycle ≈ 60 s (DEF-028)
      note: plan de feux supposé, à remplacer par le plan réel de la Métropole
      phases:
        - nom: P1 Vieux Chêne
          mouvements: [vc_ouest TD, vc_ouest TAG, vc_est TD, vc_est TAD]
          vert: 35
        - nom: P2 desserte
          mouvements: [desserte_n TAG, desserte_n TAD]
          vert: 15
ecarts_admis:
  RF-OSM-LAR-010: "voies relevées entre lignes et bordures du levé GAM : 3,3 m à l'ouest (coupe o_20), 3,0-3,4 m à l'est (coupe e_20), desserte de 5,18 m à double sens sans axe (coupe n_12 : 2 × 2,6 m)"
