# marquages refaits depuis 2024. Cotes : coupes sur le levé GAM et le PCRS (mesures.json « coupes ») ; OSM local.
# Provenance en fin de ligne : coupe:<nom>, photo:<id>, osm:<way|node>, DEF-/RF- (règle complétée si non dit).
