# A1 — Autoroute 2 × 2 voies, section courante, terre-plein central à GBA (double barrière en béton adhérent).
# Voies de 3,50 m, BAU de 3,00 m, bermes de 1,00 m (RF-OSM-LAR-014 : autoroute) ; TPC de 2,60 m = BDG 1,00 + bande
# médiane 0,60 portant la GBA + BDG 1,00 (RF-GV-TPC-002 : type A, DBA 0,60 + BDG normale 1,00 ; RF-GV-TPC-003 ;
# RF-OBS-TPC-01 : DBA béton double ≈ 2,6 m observé en Isère ; RF-GV-TPC-008 : barrières sur tout TPC < 12 m). La bande
# médiane est décrite en deux demi-bandes revêtues de plain-pied de 0,30 m de part et d'autre de la GBA (posée sur la
# limite centrale, largeur 0,60 m).
# Marquages (déduits) : u = 7,5 cm (DEF-001, RF-MQ-U-01) ; délimitation T1 2u ; rive de BAU T4 3u ; rive côté TPC
# continue 3u (RF-MQ-SC-06, RF-OSM-MRQ-022). Vitesse 130 km/h (RF-OSM-VIT-003).
