# A3 — Bretelle d'entrée sur autoroute 2 × 2 voies : entrée en insertion (voie d'accélération parallèle + biseau).
# Chaussée principale : profil de A1 (voies 3,50, BAU 3,00, bermes 1,00, TPC 2,60 à GBA ; RF-OSM-LAR-014, RF-GV-TPC-002).
# Bretelle : voie de 3,50 m, BAU de 3,00 m (rive T'3 3u des bretelles, RF-MQ-SC-06), berme 1,00 m ; elle aborde la
# principale avec une obliquité de 1/25 (VSA 90/110 Cerema 2014 p. 38 : entrée entre 1/33 et 1/20 ; ICTAVRU p. 84 :
# 1/30 à 1/20), en alignement sur 140 m après un arc de 200 m.
# Dispositif (VSA 90/110 p. 34, schéma 26 « insertion d'une voie ») : zone de manœuvre parallèle de 200 m depuis le point
# E.1,00 m, puis biseau de 75 m ; la voie d'insertion est séparée de la voie de droite par une ligne T2 5u (RF-MQ-INS-01,
# qui vaut ligne cédez ; IISR7 tableau 113-2 B1b) ; BAU interrompue au droit du musoir. Musoir de convergence : chevrons
# entre le point à 5,00 m (E.5,00, nez du terre-plein latéral) et le point à 1,00 m (E.1,00), contour continue 3u, espace
# 2u (RF-MQ-MUS-01, RF-MQ-HACH-02) ; terre-plein latéral en saillie au-delà, à 0,70 m des chaussées (VSA p. 39, note 23).
# ICTAAL n'est pas dans les sources locales du dépôt : les longueurs sont celles de la VSA 110 (voie à caractéristiques
# autoroutières), la vitesse de la principale est portée à 110 km/h en conséquence.
# Lot autoroutes (18/10/2026) : rive gauche de la bretelle continue 3u (IISR7 art. 114-4 B p. 15 : « en l'absence de
# bande d'arrêt d'urgence, la ligne de rive est continue de largeur 3u » ; RF-MQ-SC-06 sans_bau, RF-OSM-MRQ-022) au lieu
# de la rive de route T2 3u déduite par défaut (RF-OSM-MRQ-021, routes). La BDG de 0,50 m de la VSA 90/110 (§ 6.4.5.2
# p. 49) n'est pas décrite : le compilateur ancre une route à sens unique sur son bord gauche, une BDG interrompue
# avant la jonction déplacerait la voie de 0,50 m (signalé à l'intégration).
format: description_simple/0.2
