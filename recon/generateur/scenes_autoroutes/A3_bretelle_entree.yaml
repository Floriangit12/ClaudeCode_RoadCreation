titre: Autoroute 2 × 2, bretelle d'entrée en insertion
description: "Entrée sur autoroute 2 × 2 voies : bretelle à obliquité 1/25, musoir à chevrons, voie d'insertion de 200 m puis biseau de 75 m, ligne T2 5u."
contexte: {agglomeration: non, categorie: autoroute, vitesse: 110}
