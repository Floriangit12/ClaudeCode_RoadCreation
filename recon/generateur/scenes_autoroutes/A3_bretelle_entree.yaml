      # de l'étape 2 : la dernière T4 tronquée était retirée, 32 m de rive sans peinture avant le musoir)
      - profil: {a: 140, nouveau: "berme 1,0 | BAU 3,0 | voie 3,5 ← | voie 3,5 ← | BDG 1,0 | TPC 0,3 béton plain-pied | GBA largeur 0,6 | TPC 0,3 béton plain-pied | BDG 1,0 | voie 3,5 → | voie 3,5 → | ligne continue 3u | BAU 3,0 | berme 1,0"}
      # E.5,00 (écart de 5 m à 125 m de la jonction, obliquité 1/25) : la BAU s'interrompt au droit du musoir
      - profil: {a: 175, nouveau: "berme 1,0 | BAU 3,0 | voie 3,5 ← | voie 3,5 ← | BDG 1,0 | TPC 0,3 béton plain-pied | GBA largeur 0,6 | TPC 0,3 béton plain-pied | BDG 1,0 | voie 3,5 → | voie 3,5 →"}
      # jonction (pointe du musoir) : la voie de la bretelle devient la voie d'insertion
      - profil: {a: 300, nouveau: "berme 1,0 | BAU 3,0 | voie 3,5 ← | voie 3,5 ← | BDG 1,0 | TPC 0,3 béton plain-pied | GBA largeur 0,6 | TPC 0,3 béton plain-pied | BDG 1,0 | voie 3,5 → | voie 3,5 → | ligne T2 5u | voie d'insertion 3,5 → | BAU 3,0 | berme 1,0"}
      # fin de la zone de manœuvre (200 m après E.1,00, soit 175 m après la jonction) puis biseau de 75 m
      - fermeture: {a: 550, longueur: 75, nouveau: "berme 1,0 | BAU 3,0 | voie 3,5 ← | voie 3,5 ← | BDG 1,0 | TPC 0,3 béton plain-pied | GBA largeur 0,6 | TPC 0,3 béton plain-pied | BDG 1,0 | voie 3,5 → | voie 3,5 → | BAU 3,0 | berme 1,0"}
