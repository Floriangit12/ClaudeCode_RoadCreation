# J2 — Carrefour en croix hors agglomération, route départementale prioritaire, route secondaire en STOP.
# Route départementale à 80 km/h (RF-OSM-VIT-003) : voies de 3,00 m (RF-OSM-LAR-014 RD 1 chaussée), bandes dérasées
# de 0,50 m (RF-OSM-LAR-014), rives T2 3u (RF-OSM-MRQ-021), axe T1 2u (RF-OSM-MRQ-010), bermes de 1,00 m.
# Route secondaire (voie communale) 2 × 3,00 m, bermes de 1,00 m. STOP confirmé par la description : AB4 au droit de
# la ligne continue de 0,50 m (RF-SV-AB4.POSITION, RF-MQ-STOP-01), continue axiale 2u sur 15 m (DEF-013), AB5 à 150 m
# (RF-SV-AB5.EMPLOI) ; route prioritaire : AB2 à 150 m (RF-SV-AB2.EMPLOI), balises J3 dans les quatre angles (RF-SV-J3 :
# hors agglomération sans îlot séparateur sur la route prioritaire). Rayons d'angle 12 m (RF-GV-RAY-001 : périurbain PL
# 8-12 m ; borne haute retenue pour la giration des PL en rase campagne).
