# DEF-012), bandes de 4,00 m (DEF-011). Rayons d'angle 8 m (DEF-010, feux 6-8 m). Plan de feux en 2 phases (RF-GV-FEU-001,
# CF p. 40 : TAG contournés par la droite, sans guidage) ; durées : vert dit, jaune 3 s (DEF-028), dégagement calculé.
