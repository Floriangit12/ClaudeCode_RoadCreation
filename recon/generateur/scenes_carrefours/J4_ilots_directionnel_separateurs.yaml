# J4 — Carrefour en croix en agglomération : îlots séparateurs urbains compacts sur la rue secondaire et îlot
# directionnel de tourne-à-droite avec voie directe (shunt) en cédez le passage.
# Avenue prioritaire 2 × 1 voie de 3,00 m (RF-OSM-LAR-010), trottoirs 2,50 m. Rue secondaire 2 × 1 voie de 3,00 m en
# cédez (AB3a + M9c, RF-SV-AB3A.POSITION ; ligne T'2 0,50 à la limite de la chaussée prioritaire, DEF-012) ; à son
# débouché, un îlot séparateur urbain compact de 2,00 m (refuge, DEF-022 ; VU p. 83) précédé de sa zone hachurée : les
# voies s'écartent de 1,00 m de chaque côté sur 15 m (déport 1/15, RF-GV-CAR-010) ; pas de continue d'approche (îlot) ;
# bordures I2 de l'îlot à 0,12 m de vue (refuge : RF-MA-REF-003, DEF-005 refuge_min).
# Voie directe de tourne-à-droite de la branche sud vers l'est : bordure de R = 25 m, voie de 4,00 m (RF-GV-VS-017,
# shunt à 30 km/h) ; îlot directionnel en saillie à 0,50 m de l'enveloppe, nez de 0,50 m (RF-GV-ILO-015), AB3a + M9c
# sur l'îlot (IISR3 art. 42-9) ; passage piéton prolongé à travers la voie directe, refuge sur l'îlot.
# Corrigée le 18/10/2026 (contrôle de l'étape 2, balayages sur les trajectoires finales du lot L4, TAG compris) : les
# TAG de l'avenue vers les rues balayaient les nez des îlots séparateurs (VL −2,4 m) sans qu'ils puissent reculer, le
# refuge du passage (2 m de la ligne cédez) plafonnant le retrait ; passage de la rue nord à 6 m de la ligne cédez (retrait
# dit ; la rue sud garde 2 m : son passage se prolonge à travers la voie directe sur l'îlot directionnel), bus standard
# 12 m : ligne de l'avenue (tout droit).
