# J5 — CARREFOUR COMPLEXE (scène A du plan, PLAN_GENERATEUR § 4) : artère 2 × 2 voies avec voies de tourne-à-gauche
# et rue 1 + 1, feux à quatre phases dont une phase spéciale des TAG à l'indonésienne guidés en T'2 0,10.
#
# Corrigée le 18/10/2026 après le contrôle indépendant de l'étape 2 (la version précédente n'était pas praticable :
# les deux TAG guidés de la phase spéciale passaient à 1,96 m d'axe à axe, caisses à 3 mm de la ligne ; nez d'îlots
# dans les balayages ; TAG de la rue croisés dans la même phase ; refuges des TPC en gazon ; passages dans les congés) :
# - voies de TAG opposées FACE À FACE (même axe) : TPC de 3,50 m (RF-OBS-TPC-01, avenue de Crolles : TPC engazonné de
#   3,5 m) et îlot de TAG de 3,50 m de part et d'autre de la voie de TAG ; les deux courants passent l'un devant l'autre
#   de part et d'autre de l'oblique de guidage (RF-MQ-CAR-03) avec la garde de RF-GV-TRJ-006 entre leurs enveloppes ;
# - nez des îlots placés par les balayages des trajectoires finales du lot L4 (une seule source) ;
# - rue : une phase par approche (P3 nord, P4 sud) : ses deux TAG ne se croisent jamais dans une même phase ;
# - passages à 5 m de la zone de conflit (RF-GV-PIE-006 : 2 à 5 m) et rayons d'angle de 6 m (DEF-010, feux : 6-8 m) :
#   les bandes vont jusqu'à la bordure (point de tangence du congé au droit du passage) ;
# - refuges des TPC revêtus au droit des passages (compilateur, RF-OBS-ILO-01) ;
# - bus standard 12 m : ligne de l'artère (tout droit) ; le VL dessert tous les mouvements.
#
# Artère (est-ouest), 50 km/h : section courante trottoir 3,00 | bande cyclable 1,50 | 2 voies de 3,00 | TPC planté de
# 3,50 m | 2 voies de 3,00 | bande cyclable 1,50 | trottoir 3,00 (RF-OSM-LAR-012 même sens 3,00 ; DEF-007 bande 1,50 ;
# RF-GV-TPC-001 TPC paysager ≤ 10 m). À chaque approche (« îlot central de TAG », épure VSA70 du dossier 10) : sur
# 52,5 m, une voie de TAG de 3,00 m (RF-GV-VS-002 ≥ 2,75 m) et une zone hachurée de 3,50 m s'ouvrent à droite du TPC
# (6,50 m, RF-OSM-LAR-050) ; les voies se déportent de 3,25 m de chaque côté (1/16,2 < 1/15, RF-GV-CAR-010, déport
# symétrique) et la ligne de référence (séparation des sens) se décale de 3,25 m par deux arcs de 212,83 m : les voies
# directes sont alignées de part et d'autre du carrefour (RF-GV-CAR-007) et les deux voies de TAG sont dans le même
# axe. La zone hachurée devient (5 m plus loin) l'îlot de 3,50 m qui sépare la voie de TAG des voies directes et porte
# les R11 des deux couloirs (RF-FEU.PHASE_SPECIALE, IISR6 art. 110-1 3° ; RF-GV-TPC-001 îlot pour TAG ≥ 2,00 m) ;
# stockage ≈ 50 m (RF-GV-VS-012). Bordures des refuges à 0,12 m (RF-MA-REF-003, DEF-005).
# Rue (nord-sud) 1 + 1, voies de 3,00 m (RF-OSM-LAR-010), trottoirs 2,50 m ; à son débouché un îlot séparateur urbain
# compact de 2,00 m (VU p. 83, refuge DEF-022) précédé de sa zone hachurée (déport 1/15 de chaque côté).
# Feux : quatre phases (RF-GV-FEU-001 ; DEF-028 : TAG à l'indonésienne jamais en cycle à 2 phases) — P1 artère (directs
# et TAD, piétons de la rue), P2 phase spéciale des TAG de l'artère (aucun autre mouvement), P3 rue nord, P4 rue sud
# (piétons de l'artère dans les deux) ; jaune 3 s (DEF-028), dégagement calculé à 10 m/s (RF-GV-FEU-004) ; verts dits.
# Guidage : trajectoires des TAG en phase spéciale matérialisées en T'2 0,10 (RF-MQ-GUI-01, IISR7 p. 36 ; ARB-08 :
# guidage seulement s'il est décrit).
# Sas vélos de 4 m sur les deux approches de l'artère (DEF-016, RF-MQ-SAS-01), lignes d'effet peintes (ARB-01).
# Voie directe de tourne-à-droite de la rue sud vers l'est, en cédez (AB3a sur son support, IISR3 art. 42-9) : bordure
# R = 30 m (≥ 25 m de RF-GV-VS-017, pour que l'îlot directionnel offre un refuge ≥ 2,00 m au droit de la traversée,
# DEF-022), voie de 4,00 m (RF-GV-VS-017) ; îlot directionnel en saillie de 0,50 m, nez 0,50 m (RF-GV-ILO-015).
# Passages piétons sur les quatre branches, 5 m en retrait de la zone de conflit (RF-GV-PIE-006 : 2 à 5 m), avec
# refuges ; rayons d'angle 6 m (DEF-010 aux feux : 6 à 8 m).
