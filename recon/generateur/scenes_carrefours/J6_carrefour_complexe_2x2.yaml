# J6 — SECOND CARREFOUR COMPLEXE (lot correction de l'étape 2, 18/10/2026) : croisement de deux avenues 2 × 2 voies à
# terre-plein central, voies de tourne-à-gauche face à face sur les QUATRE approches, TAG à l'indonésienne guidés en
# T'2 0,10 sur les deux axes (deux phases spéciales), deux voies directes de tourne-à-droite en cédez derrière des îlots
# directionnels (coins opposés), feux à quatre phases, passages avec refuges revêtus sur les quatre branches.
#
# Avenue est-ouest : celle de J5 (trottoir 3,00 | bande cyclable 1,50 | 2 voies de 3,00 | TPC engazonné de 3,50 m,
# RF-OBS-TPC-01 | 2 voies | bande cyclable | trottoir) ; avenue nord-sud : même profil sans bande cyclable (trottoirs de
# 3,00 m, RF-OSM-LAR-012). À chaque approche, sur 52,5 m : voie de TAG de 3,00 m (RF-GV-VS-002) et zone hachurée de
# 3,50 m qui devient l'îlot de 3,50 m portant les R11 des deux couloirs (RF-FEU.PHASE_SPECIALE ; RF-GV-TPC-001 ≥ 2,00) ;
# déport symétrique de 3,25 m (1/16,2 < 1/15, RF-GV-CAR-010) par la ligne de référence (deux arcs de 212,83 m) : voies
# directes alignées (RF-GV-CAR-007), voies de TAG opposées dans le même axe, les deux courants guidés passent l'un devant
# l'autre de part et d'autre de l'oblique (RF-MQ-CAR-03, garde RF-GV-TRJ-006).
# Feux (RF-GV-FEU-001 ; DEF-028 : TAG à l'indonésienne seulement en phase spéciale) : P1 directs est-ouest (piétons
# nord et sud), P2 TAG est-ouest guidés, P3 directs nord-sud (piétons est et ouest), P4 TAG nord-sud guidés.
# Tourne-à-droite : voies directes en cédez de la branche sud vers l'est et de la branche nord vers l'ouest, voie de
# 4,00 m, bordure R = 30 m (RF-GV-VS-017 ≥ 25 m), îlot directionnel en saillie de 0,50 m, nez 0,50 m (RF-GV-ILO-015) ;
# autres coins : rayon 6 m (DEF-010 aux feux : 6-8 m).
# Passages : 5 m en retrait de la zone de conflit (RF-GV-PIE-006 : 2-5 m), refuges revêtus (RF-OBS-ILO-01) ; sas vélos de
# 4 m sur l'avenue est-ouest (DEF-016). Bus standard 12 m : lignes en tout droit sur les deux avenues.
