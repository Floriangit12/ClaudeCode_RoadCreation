# G1 — Giratoire urbain de 40 m de diamètre, 4 branches, couronne franchissable de 1,50 m (scène B du plan, § 4).
# Rg = 20 m (diamètre observé en Isère 29-66 m, DEF-024 ; classe « moyen » 15-22 m, RF-GV-GIR-001) ; anneau de 7,00 m
# (DEF-024, RF-GV-GIR-004 : 6-9 m) ; couronne franchissable de 1,50 m en pavés, bordure de 0,03 m (RF-GV-GIR-006 : bande
# 1,50-2,00 m, vue ≤ 3 cm) ; îlot central planté (gazon) de rayon 11,50 m (≥ 3,50 m), bordure ≤ 6 cm (RF-GV-GIR-006).
# Branches : rues 2 × 1 voie de 3,00 m (RF-OSM-LAR-010), trottoirs de 2,50 m ; à 20 m de l'anneau, l'entrée passe à
# 4,00 m (RF-GV-GIR-010 urbain 3-4 m ; ACI tabl. 1 Rg 20 : le = 4, RF-GV-GIR-003) et la sortie à 4,50 m (RF-GV-GIR-012
# 4-5 m ; tabl. 1 : ls = 4,5) ; entre elles, l'enveloppe peinte de l'îlot séparateur (ACI tabl. 2, RF-GV-GIR-013 :
# H = Rg = 20 m, B = Rg/4 = 5,00 m, d = 0,45 m, r = 0,40 m ; retrait de 1 m sur l'anneau ; saillie 0,50 m).
# Ligne cédez à chaque entrée, AB25 à 50 m (RF-SV-AB25.DISTANCE.GENERATEUR agglomération 0-50 m), B21-1 sur l'îlot
# central face à chaque entrée (RF-GV-GIR-024) ; pas d'AB3a en agglomération (facultatif) ; passages 5 m en retrait de
# la ligne cédez (ARB-02 : Rg ≥ 15 m), refuge ≥ 2,00 m dans l'îlot séparateur (RF-GV-GIR-014).
