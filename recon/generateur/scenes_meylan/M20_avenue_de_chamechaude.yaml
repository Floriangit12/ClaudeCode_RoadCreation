# Avenue de Chamechaude (Meylan), section droite au nord du giratoire du site M20 — décrite en regardant les tuiles de
# la photo Panoramax 30b80a7b (dossier 13, 28/07/2026, etalab-2.0 ign / ceremadtermed-ti ; jamais versionnée ni
# diffusée) :
#   - vise_30b80a7b_centre_t-12 : rue 1 + 1 d'environ 6 m sans ligne axiale visible, entre bordures basses ; grands
#     arbres (chênes) qui couvrent la chaussée à droite, bouleaux et immeuble à gauche ; passage piéton à quelques
#     dizaines de mètres, signalé par un C20a sur poteau en rive droite (observation M20 : bord inférieur ≈ 2,2 m) ;
#   - tuile l+51 : à droite, bordure basse, accotement enherbé sec d'environ 2,5 m, chemin piéton en enrobé d'environ
#     1,8 m, puis sous-bois ; tuile l-51 : à gauche, accotement enherbé large (2-4 m, observation M20) ;
#   - enrobé gris clair en bon état, ombres des arbres sur la chaussée (été).
#   - au droit du passage (tuile vise, correction après le second contrôle) : à gauche, le passage débouche sur une
#     surface revêtue qui part vers l'immeuble ; à droite, vers le chemin piéton derrière l'accotement (au pied du C20a).
# Simplifications déclarées : tronçon droit de 100 m (la rue tourne légèrement plus loin) ; le passage est placé à 30 m
# du début du tronçon ; cotes « ≈ » estimées sur photo ; vue des bordures basses estimée à 0,06 (A2 : 0,04-0,10, RF-AS-profil_A2) ;
# traversées revêtues au droit du passage (28 à 32) : à gauche un chemin en enrobé à travers la bande plantée (vers
# l'immeuble, hors de l'image), à droite une liaison en enrobé à travers l'accotement jusqu'au chemin piéton, au niveau
# des bandes hautes (abaissés et BEV contre la chaussée).
