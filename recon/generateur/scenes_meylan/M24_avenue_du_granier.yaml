# Avenue du Granier (Meylan, Inovallée), au passage piéton à refuge du site M24 — décrite en regardant les tuiles des
# photos Panoramax 9badc00e et f877235a (dossier 13, 12/01/2025, CC-BY-SA icluf ; jamais versionnées ni diffusées) :
#   - vise_f877235a_centre_t-12 et vise_9badc00e_centre_t-12 : chaussée 2 × 1 voies d'environ 3,25 m, passage piéton en
#     deux temps (bandes de 0,50 m, longues d'environ 4 m), îlot refuge central étroit (≈ 1,80 m, observation M24 :
#     1,8 ± 0,4) à bordures basses arrondies (vue ≈ 0,10 ± 0,04), coupé à niveau au droit du passage, nez avec une
#     balise ; au-delà du nez, une ligne continue qui s'écarte : zone peinte d'approche ;
#   - côté du photographe : bordure abaissée au passage, trottoir en béton balayé à joints (≈ 3 m), dalles podotactiles
#     jointées gris clair au droit du passage, piste cyclable bidirectionnelle en enrobé gris (figurines vélo) au niveau
#     du trottoir, séparée par le changement de matériau, puis massif d'arbustes (lavandes) ;
#   - en face : trottoir béton (≈ 2 m) puis large bande enherbée avec des arbres isolés, devant les immeubles ;
#   - enrobé gris un peu usé, tampons de regard, marquages grisés (usure moyenne) ; hiver : arbres nus.
# Simplifications déclarées : tronçon droit de 90 m ; la zone peinte d'approche est décrite comme une zone hachurée de
# la largeur de l'îlot sur tout le tronçon (pas de biseau : une bande qui naît en cours de tronçon décroche les rives) ;
# l'îlot bordé fait 12 m (longueur non mesurable sur la photo) ; les cotes « ≈ » sont des estimations sur photo.
