# Avenue de Verdun (Meylan, centre), au passage piéton à refuge du site M27 — décrite en regardant les tuiles des
# photos Panoramax 176f9ab0 et 7ab5b751 (dossier 13, 18/05/2025, CC-BY-SA Eric S ; jamais versionnées ni diffusées) :
#   - vise_176f9ab0_centre_t-12 et vise_7ab5b751_centre_t-12 : avenue 2 × 1 voies larges (≈ 3,25 m ; l'observation M27 suppose 3,2 m), îlot peint
#     hachuré dans l'axe (contour continu, hachures obliques) qui devient au passage un îlot refuge bordé court
#     (≈ 10 m, largeur 2,8 ± 0,6 m, bordure basse arrondie vue 0,11 ± 0,04, surface en enrobé gris, balise sur le nez) ;
#     passage piéton à bandes larges des deux côtés de l'îlot ; plus loin, axe en tirets et flèche « tout droit » ;
#   - rives : ligne de rive en tirets sur l'accotement enherbé à niveau (pas de bordure visible) ;
#   - côté droit (176f9ab0, l+51) : accotement enherbé d'environ 2 m fleuri, puis piste cyclable en enrobé (figurines
#     vélo) d'environ 2,5 m, puis haie et arbres ; côté gauche : accotement enherbé, trottoir en enrobé ≈ 2 m, haies ;
#   - enrobé ancien très fissuré (fissures pontées), marquages usés ; grands arbres feuillus (mai) des deux côtés.
#   - au passage (zooms des tuiles 176f9ab0 et 7ab5b751, correction après le second contrôle) : les accotements enherbés
#     sont coupés au droit du passage par une liaison revêtue au niveau de la chaussée, sur laquelle les bandes du
#     passage se prolongent jusqu'au trottoir (gauche) et à travers la piste (droite) ; aucune BEV visible au
#     débouché de plain-pied du trottoir ; au-delà de la piste, le cheminement continue hors de l'image.
# Simplifications déclarées : tronçon droit de 100 m ; îlot peint de la largeur de l'îlot bordé sur tout le tronçon ;
# la piste cyclable est décrite unidirectionnelle (sens non lisible) ; cotes « ≈ » estimées sur photo ; le
# cheminement au-delà de la piste (hors de l'image) est décrit comme un chemin piéton qui traverse la bande plantée
# au droit du passage, au niveau de la chaussée comme la liaison (débouché de plain-pied, sans BEV : écart admis).
