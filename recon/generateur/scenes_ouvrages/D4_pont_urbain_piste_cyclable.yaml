# D4 — Pont urbain avec piste cyclable bidirectionnelle sur un canal sec. Imaginé d'après les ponts urbains de
# l'agglomération grenobloise (ponts sur les canaux et les ruisseaux endigués de Meylan et de la Tronche : travées de
# poutres préfabriquées, pile à poteaux et chevêtre au fond du lit, culées perchées sur les berges, garde-corps à
# barreaudage ; piste bidirectionnelle le long du garde-corps aval). Rue 1 + 1 de 3,00 m, trottoir de 2,00 m à gauche,
# trottoir de 2,00 m puis piste bidirectionnelle de 3,00 m à droite (niveau du trottoir, RF-OSM-NIV-013).
# Deux travées isostatiques de 16 m en poutres PRAD (OA-ELA-001 : 1/18 à 1/20 ; GPOA p. 220 : espacement des poutres
# voisin d'un mètre). Garde-corps : 1,20 m le long de la piste (DEF-033, RF-GV-PON-007 cycles), bande GC97 côté
# trottoir. Canal dit : 5,50 m de profondeur, fond de 18 m, berges à 3/2 (OA-TAL-001).
