<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const W = 1000, H = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd4e6);
scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x50483c, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-80, 120, 60);              // soleil au sud-ouest (repère three : x=E, y=haut, z=-N)
scene.add(sun);
const camera = new THREE.PerspectiveCamera(60, W / H, 0.05, 2000);
// repère local Z-up (x=E, y=N, z=haut) -> three Y-up
const T = (p) => new THREE.Vector3(p[0], p[2], -p[1]);
window.loadModel = async (url) => {
  const g = await new GLTFLoader().loadAsync(url);
  let tris = 0;
  g.scene.traverse((o) => {
    if (o.isMesh) {
      tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
      const m = o.material;
      if (m) { m.side = THREE.FrontSide; m.metalness = 0; if (m.map) { m.map.anisotropy = 8; } }
    }
  });
  scene.add(g.scene);
  return { triangles: tris };
};
window.renderView = (eye, target, fov) => {
  camera.fov = fov || 60;
  camera.position.copy(T(eye));
  camera.up.set(0, 1, 0);
  camera.lookAt(T(target));
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
// Panorama équirectangulaire (comme les photos 360° Panoramax) : centre de l'image = cap (azimut,
// degrés depuis le nord, sens horaire) ; colonne -> longitude relative, ligne -> latitude.
const cubes = {};
const cube = (n) => cubes[n] || (cubes[n] = new THREE.CubeCamera(0.05, 3000, new THREE.WebGLCubeRenderTarget(n)));
const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const eqMat = new THREE.ShaderMaterial({
  uniforms: { env: { value: null }, cap: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `uniform samplerCube env; uniform float cap; varying vec2 vUv;
    void main(){
      float lon = (vUv.x - 0.5) * 6.283185307;
      float lat = (vUv.y - 0.5) * 3.141592654;
      float A = cap + lon;
      vec3 enu = vec3(sin(A) * cos(lat), cos(A) * cos(lat), sin(lat));
      gl_FragColor = textureCube(env, vec3(enu.x, enu.z, -enu.y));
      #include <colorspace_fragment>
    }`,
});
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), eqMat));
window.renderEquirect = (eye, capDeg, w, h, n) => {
  const cubeCam = cube(n || 2048);
  cubeCam.position.copy(T(eye));
  cubeCam.update(renderer, scene);
  eqMat.uniforms.env.value = cubeCam.renderTarget.texture;
  eqMat.uniforms.cap.value = capDeg * Math.PI / 180;
  renderer.setSize(w, h);
  renderer.render(quadScene, quadCam);
  const url = renderer.domElement.toDataURL('image/png');
  renderer.setSize(W, H);
  return url;
};
window.ready = true;
</script></body></html>
